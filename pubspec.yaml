name: startsa
description: "Start.sa: connects Saudi startup founders with angel investors."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.5
  image_picker: ^1.2.3
  image_cropper: ^12.2.1
  # Re-compresses a picked photo or logo that is still over 100 KB.
  image: ^4.12.0
  url_launcher: ^6.3.3
  path_drawing: ^1.0.1
  app_links: ^7.2.2
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# App icon. After changing the images in assets/icon, run
# `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
