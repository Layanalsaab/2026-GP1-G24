<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join a team on Start.sa</title>
  <style>
    :root { --green:#1f3f27; --moss:#2f5d3a; --cream:#faf8f4; --ink:#1c1f1d; --grey:#5b625d; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--cream); color:var(--ink);
           font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
           display:flex; min-height:100vh; align-items:center; justify-content:center; padding:20px; }
    .card { background:#fff; border:1px solid #ebe7df; border-radius:20px; max-width:440px; width:100%;
            padding:28px 24px; text-align:center; }
    .logo { width:56px; height:56px; border-radius:16px; margin:0 auto 16px; background:linear-gradient(145deg,#faf3e3,#f2e6c9);
            display:flex; align-items:center; justify-content:center; color:#7a5a12; font-weight:700; font-size:20px; }
    h1 { font-size:21px; margin:0 0 14px; }
    p { font-size:15px; line-height:22px; color:var(--grey); margin:0 0 12px; }
    /* Shown on Android only (see the script below). */
    .open { display:none; align-items:center; justify-content:center; width:100%; min-height:56px;
            margin:6px 0 18px; padding:14px 18px; border-radius:14px; background:#1e7a3c; color:#fff;
            font-size:17px; font-weight:700; text-decoration:none; }
    .open:active { background:#17622f; }
    .android .open { display:flex; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">S</div>
    <h1>You’re invited to join a team on Start.sa</h1>

    <!-- Android only: opens THIS invite link in the Start.sa app, addressed to
         the app by its package name. That works even when Android has not
         verified the App Link (verification only decides who opens a plain
         https link, not an intent sent straight to the app). The script below
         adds the invitation id and a way back to this page. -->
    <a id="open" class="open"
       href="intent://startsa-ea49e.web.app/invite#Intent;scheme=https;package=com.example.startsa;end">Open the Start.sa app</a>

    <p id="how">Sign up or log in with the email this invitation was sent to, and you’ll be added to the team automatically. Don’t have the app yet? Install it, then come back to this email.</p>
  </main>
  <script>
    (function () {
      // The button is for Android phones. On an iPhone or a computer only the
      // text shows.
      if (/Android/i.test(navigator.userAgent)) {
        document.documentElement.className += ' android';
      }
      var id = new URLSearchParams(location.search).get('i');
      // The button opens this same invite link in the app (package
      // com.example.startsa). If the app is not installed, Chrome comes back
      // to this page instead of going to the Play Store.
      document.getElementById('open').href =
        'intent://startsa-ea49e.web.app/invite' +
        (id ? '?i=' + encodeURIComponent(id) : '') +
        '#Intent;scheme=https;package=com.example.startsa;' +
        'S.browser_fallback_url=' + encodeURIComponent(location.href) + ';end';
      // Somebody with no Start.sa account yet is only told to sign up.
      if (!id) return;
      fetch('https://firestore.googleapis.com/v1/projects/startsa-ea49e/databases/(default)/documents/invitations/' + encodeURIComponent(id))
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
          var f = d && d.fields;
          if (f && f.newUser && f.newUser.booleanValue) {
            document.getElementById('how').textContent =
              'Sign up with the email this invitation was sent to, and you’ll be added to the team automatically. Don’t have the app yet? Install it, then come back to this email.';
          }
        })
        .catch(function () {});
    })();
  </script>
</body>
</html>
